  ];

  var SHIFTS = { p: 0, n: 1, b: 2, r: 3, q: 4, k: 5 }

  var FLAGS = {
    NORMAL: 'n',
    CAPTURE: 'c',
    BIG_PAWN: 'b',
    EP_CAPTURE: 'e',
    PROMOTION: 'p',
    KSIDE_CASTLE: 'k',
    QSIDE_CASTLE: 'q'
  }

  var BITS = {
    NORMAL: 1,
    CAPTURE: 2,
    BIG_PAWN: 4,
    EP_CAPTURE: 8,
    PROMOTION: 16,

  }

  var RANK_1 = 7
  var RANK_2 = 6
  var RANK_3 = 5
  var RANK_4 = 4
  var RANK_5 = 3
  var RANK_6 = 2
  var RANK_7 = 1
  var RANK_8 = 0

  // prettier-ignore
  var SQUARES = {
    a8:   0, b8:   1, c8:   2, d8:   3, e8:   4, f8:   5, g8:   6, h8:   7,

    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {

    var position = tokens[0]
    var square = 0

    if (tokens[2].indexOf('Q') > -1) {

    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    move_number = parseInt(tokens[5], 10)

   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while

   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square'
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(tokens[5]) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(tokens[4]) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {

      var previous_was_number = false

            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false

        return { valid: false, error_number: 10, error: errors[10] }
      }

      (tokens[3][1] == '6' && tokens[1] == 'b')

      return { valid: false, error_number: 11, error: errors[11] }
    }

    return { valid: true, error_number: 0, error: errors[0] }

        if (empty > 0) {

      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARES[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARES)) {
      return false
    }

    var sq = SQUARES[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARES[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARES.a8
    var last_sq = SQUARES.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARES) {
        first_sq = last_sq = SQUARES[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (!single_square || last_sq === kings[us]) {
      /* king-side castling */
      if (castling[us] & BITS.KSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from + 2

        if (
          board[castling_from + 1] == null &&
          board[castling_to] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from + 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
        }
      }

      /* queen-side castling */
      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, sloppy) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      var disambiguator = get_disambiguator(move, sloppy)

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
  }

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  /* this function is used to uniquely identify ambiguous moves */
  function get_disambiguator(move, sloppy) {
    var moves = generate_moves({ legal: !sloppy })

    var from = move.from
    var to = move.to
    var piece = move.piece

    var ambiguities = 0
    var same_rank = 0
    var same_file = 0

    for (var i = 0, len = moves.length; i < len; i++) {
      var ambig_from = moves[i].from
      var ambig_to = moves[i].to
      var ambig_piece = moves[i].piece

      /* if a move of the same piece type ends on the same to square, we'll
       * need to add a disambiguator to the algebraic notation
       */
      if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
        ambiguities++

        if (rank(from) === rank(ambig_from)) {
          same_rank++
        }

        if (file(from) === file(ambig_from)) {
          same_file++
        }
      }
    }

    if (ambiguities > 0) {
      /* if there exists a similar moving piece on the same rank and file as
       * the move in question, use the square as the disambiguator
       */
      if (same_rank > 0 && same_file > 0) {
        return algebraic(from)
      } else if (same_file > 0) {
        /* if the moving piece rests on the same file, use the rank symbol as the
         * disambiguator
         */
        return algebraic(from).charAt(1)
      } else {
        /* else use the file symbol */
        return algebraic(from).charAt(0)
      }
    }

    return ''
  }

  function ascii() {
    var s = '   +------------------------+\n'
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* display the rank */
      if (file(i) === 0) {
        s += ' ' + '87654321'[rank(i)] + ' |'
      }

      /* empty piece */
      if (board[i] == null) {
        s += ' . '
      } else {
        var piece = board[i].type
        var color = board[i].color
        var symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
        s += ' ' + symbol + ' '
      }

      if ((i + 1) & 0x88) {
        s += '|\n'
        i += 8
      }
    }
    s += '   +------------------------+\n'
    s += '     a  b  c  d  e  f  g  h\n'

    return s
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?!
    var clean_move = stripped_san(move)

    // if we're using the sloppy parser run a regex to grab piece, to, and from
    // this should parse invalid SAN like: Pe2-e4, Rc1c4, Qf3xf7
    if (sloppy) {
      var matches = clean_move.match(
        /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
      )
      if (matches) {
        var piece = matches[1]
        var from = matches[2]
        var to = matches[3]
        var promotion = matches[4]
      }
    }

    var moves = generate_moves()
    for (var i = 0, len = moves.length; i < len; i++) {
      // try the strict parser first, then the sloppy parser if requested
      // by the user
      if (
        clean_move === stripped_san(move_to_san(moves[i])) ||
        (sloppy && clean_move === stripped_san(move_to_san(moves[i], true)))
      ) {
        return moves[i]
      } else {
        if (
          matches &&
          (!piece || piece.toLowerCase() == moves[i].piece) &&
          SQUARES[from] == moves[i].from &&
          SQUARES[to] == moves[i].to &&
          (!promotion || promotion.toLowerCase() == moves[i].promotion)
        ) {
          return moves[i]
        }
      }
    }

    return null
  }

  /*****************************************************************************
   * UTILITY FUNCTIONS
   ****************************************************************************/
  function rank(i) {
    return i >> 4
  }

  function file(i) {
    return i & 15
  }

  function algebraic(i) {
    var f = file(i),
      r = rank(i)
    return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
  }

  function swap_color(c) {
    return c === WHITE ? BLACK : WHITE
  }

  function is_digit(c) {
    return '0123456789'.indexOf(c) !== -1
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, false)
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  function clone(obj) {
    var dupe = obj instanceof Array ? [] : {}

    for (var property in obj) {
      if (typeof property === 'object') {
        dupe[property] = clone(obj[property])
      } else {
        dupe[property] = obj[property]
      }
    }

    return dupe
  }

  function trim(str) {
    return str.replace(/^\s+|\s+$/g, '')
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC CONSTANTS (is there a better way to do this?)
     **************************************************************************/
    WHITE: WHITE,
    BLACK: BLACK,
    PAWN: PAWN,
    KNIGHT: KNIGHT,
    BISHOP: BISHOP,
    ROOK: ROOK,
    QUEEN: QUEEN,
    KING: KING,
    SQUARES: (function() {
      /* from the ECMA-262 spec (section 12.6.4):
       * "The mechanics of enumerating the properties ... is
       * implementation dependent"
       * so: for (var sq in SQUARES) { keys.push(sq); } might not be
       * ordered correctly
       */
      var keys = []
      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (i & 0x88) {
          i += 7
          continue
        }
        keys.push(algebraic(i))
      }
      return keys
    })(),
    FLAGS: FLAGS,

    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function(fen) {
      return load(fen)
    },

    reset: function() {
      return reset()
    },

    moves: function(options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(move_to_san(ugly_moves[i], false))
        }
      }

      return moves
    },

    in_check: function() {
      return in_check()
    },

    in_checkmate: function() {
      return in_checkmate()
    },

    in_stalemate: function() {
      return in_stalemate()
    },

    in_draw: function() {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function() {
      return insufficient_material()
    },

    in_threefold_repetition: function() {
      return in_threefold_repetition()
    },

    game_over: function() {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function(fen) {
      return validate_fen(fen)
    },

    fen: function() {
      return generate_fen()
    },

    board: function() {
      var output = [],
        row = []

      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({ type: board[i].type, color: board[i].color })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function(options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header headerrmation */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with 1. ... */
        if (!history.length && move.color === 'b') {
          move_string = move_number + '. ...'
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string = move_string + ' ' + move_to_san(move, false)
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(move_string)
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what is was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function(pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function has_keys(object) {
        for (var key in object) {
          return true
        }
        return false
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          key = headers[i].replace(/^\[([A-Z][A-Za-z]*)\s.*\]$/, '$1')
          value = headers[i].replace(/^\[[A-Za-z]+\s"(.*)"\]$/, '$1')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      for (var key in headers) {
        set_header([key, headers[key]])
      }

      /* load the starting position indicated by [Setup '1'] and
       * [FEN position] */
      if (headers['SetUp'] === '1') {
        if (!('FEN' in headers && load(headers['FEN'], true))) {
          // second argument to load: don't clear the headers
          return false
        }
      }

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      /* delete comments */
      ms = ms.replace(/(\{[^}]+\})+?/g, '')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g
      while (rav_regex.test(ms)) {
        ms = ms.replace(rav_regex, '')
      }

      /* delete move numbers */
      ms = ms.replace(/\d+\.(\.\.)?/g, '')

      /* delete ... indicating black to move */
      ms = ms.replace(/\.\.\./g, '')

      /* delete numeric annotation glyphs */
      ms = ms.replace(/\$\d+/g, '')

      /* trim and get array of moves */
      var moves = trim(ms).split(new RegExp(/\s+/))

      /* delete empty entries */
      moves = moves
        .join(',')
        .replace(/,,+/g, ',')
        .split(',')
      var move = ''

      for (var half_move = 0; half_move < moves.length - 1; half_move++) {
        move = move_from_san(moves[half_move], sloppy)

        /* move not possible! (don't clear the board to examine to show the
         * latest valid position)
         */
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }

      /* examine last move */
      move = moves[moves.length - 1]
      if (POSSIBLE_RESULTS.indexOf(move) > -1) {
        if (has_keys(header) && typeof header.Result === 'undefined') {
          set_header(['Result', move])
        }
      } else {
        move = move_from_san(move, sloppy)
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }
      return true
    },

    header: function() {
      return set_header(arguments)
    },

    ascii: function() {
      return ascii()
    },

    turn: function() {
      return turn
    },

    move: function(move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })
       */

      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function() {
      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function() {
      return clear()
    },

    put: function(piece, square) {
      return put(piece, square)
    },

    get: function(square) {
      return get(square)
    },

    remove: function(square) {
      return remove(square)
    },

    perft: function(depth) {
      return perft(depth)
    },

    square_color: function(square) {
      if (square in SQUARES) {
        var sq_0x88 = SQUARES[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

    history: function(options) {
      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move))
        }
        make_move(move)
      }

      return move_history
    }
  }
}

function evaluate(g){ // du point de vue des blancs
  const b=g.board(); let s=0, mat=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c]; if(p&&p.type!=='k'&&p.type!=='p')mat+=VAL[p.type];}
  const end=mat<=1300;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c]; if(!p)continue;
    const t=(p.type==='k'&&end)?'ke':p.type;
    const idx=p.color==='w'?r*8+c:(7-r)*8+c;
    const v=VAL[p.type]+PST[t][idx]; s+=p.color==='w'?v:-v;}
  return s;
}
const LEVELS={
 800:{depth:1,noise:120,blunder:0.22,q:false,time:400},
 1000:{depth:2,noise:70,blunder:0.10,q:false,time:800},
 1200:{depth:2,noise:35,blunder:0.04,q:true,time:1000},
 1400:{depth:3,noise:20,blunder:0.02,q:true,time:1500},
 1600:{depth:3,noise:8,blunder:0,q:true,time:2000},
 1800:{depth:4,noise:0,blunder:0,q:true,time:3000},
 2000:{depth:5,noise:0,blunder:0,q:true,time:4500}};

function orderMoves(ms){return ms.sort((a,b)=>score(b)-score(a));
  function score(m){let s=0; if(m.captured)s+=10*VAL[m.captured]-VAL[m.piece]+1000; if(m.promotion)s+=800; return s;}}
function bestMove(g,elo,book){
  const L=LEVELS[elo]; const t0=Date.now(); let abort=false; let nodes=0;
  const sign=g.turn()==='w'?1:-1;
  // livre d'ouvertures
  if(book){const h=g.history().join(' ');const cands=[];
    for(const o of OPENINGS)for(const v of o.variants){const seq=v.moves.map(m=>m[0]);const n=g.history().length;
      if(n<seq.length&&seq.slice(0,n).join(' ')===h)cands.push(seq[n]);}
    if(cands.length&&elo>=1200)return cands[Math.floor(Math.random()*cands.length)];}
  const root=g.moves({verbose:true});
  if(Math.random()<L.blunder)return root[Math.floor(Math.random()*root.length)].san;
  function q(alpha,beta,col,d){ if((++nodes&255)===0&&Date.now()-t0>L.time)abort=true; if(abort)return 0;
    const stand=col*evaluate(g); if(stand>=beta)return beta; if(alpha<stand)alpha=stand; if(d>4)return alpha;
    const ms=orderMoves(g.moves({verbose:true}).filter(m=>m.captured));
    for(const m of ms){g.move(m);const v=-q(-beta,-alpha,-col,d+1);g.undo(); if(v>=beta)return beta; if(v>alpha)alpha=v;}
    return alpha;}
  function nm(depth,alpha,beta,col,ply){
    if((++nodes&255)===0&&Date.now()-t0>L.time)abort=true; if(abort)return 0;
    const ms=g.moves({verbose:true});
    if(ms.length===0)return g.in_check()?-100000+ply:0;
    if(g.in_draw())return 0;
    if(depth===0)return L.q?q(alpha,beta,col,0):col*evaluate(g);
    orderMoves(ms);
    for(const m of ms){g.move(m);const v=-nm(depth-1,-beta,-alpha,-col,ply+1);g.undo(); if(abort)return 0;
      if(v>=beta)return beta; if(v>alpha)alpha=v;}
    return alpha;}
  let best=root.map(m=>({m,v:0}));
  orderMoves(root);
  for(let d=1;d<=L.depth;d++){
    const res=[]; let alpha=-1e9;
    for(const m of root){g.move(m);const v=-nm(d-1,-1e9,-alpha+L.noise+1,-sign,1);g.undo(); if(abort)break; res.push({m,v}); if(v>alpha)alpha=v;}
    if(abort&&d>1)break;
    best=res.length===root.length?res:best;
    if(abort)break;
    root.sort((a,b)=>{const va=(res.find(x=>x.m===a)||{v:-1e9}).v, vb=(res.find(x=>x.m===b)||{v:-1e9}).v; return vb-va;});
  }
  const top=Math.max(...best.map(x=>x.v));
  const pool=best.filter(x=>x.v>=top-L.noise).map(x=>({m:x.m,v:x.v+Math.random()*L.noise}));
  pool.sort((a,b)=>b.v-a.v);
  return pool[0].m.san;
}

<script>
const $=s=>document.querySelector(s);
const G={P:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
const FR={K:'R',Q:'D',R:'T',B:'F',N:'C'};
const fr=san=>san.replace(/[KQRBN]/g,c=>FR[c]).replace('O-O-O','O-O-O');
// ===== Échiquier =====
const B={game:new Chess(),orient:'w',sel:null,targets:[],last:null,onMove:null,locked:false};
function render(){
 const el=$('#board'); el.innerHTML='';
 const files='abcdefgh';
 const chk=B.game.in_check()?B.game.turn():null;
 for(let i=0;i<64;i++){
  const r=Math.floor(i/8),c=i%8;
  const rank=B.orient==='w'?8-r:r+1, file=B.orient==='w'?files[c]:files[7-c];
  const sq=file+rank; const p=B.game.get(sq);
  const d=document.createElement('div');
  d.className='sq '+(((r+c)%2)?'d':'l');
  if(B.last&&(B.last.from===sq||B.last.to===sq))d.classList.add('last');
  if(B.sel===sq)d.classList.add('sel');
  if(p&&p.type==='k'&&p.color===chk)d.classList.add('chk');
  if(c===7)d.insertAdjacentHTML('beforeend',`<span class="coord r" style="left:auto;right:3px">${rank}</span>`);
  if(r===7)d.insertAdjacentHTML('beforeend',`<span class="coord f" style="right:auto;left:3px">${file}</span>`);
  if(p)d.insertAdjacentHTML('beforeend',`<span class="pc ${p.color}">${G.P[p.type]}︎</span>`);
  if(B.targets.includes(sq))d.insertAdjacentHTML('beforeend',p||B.game.get(sq)?'<span class="ring"></span>':'<span class="dot"></span>');
  d.onclick=()=>tap(sq);
  el.appendChild(d);
 }
}
function tap(sq){
 if(B.locked||!B.onMove)return;
 const p=B.game.get(sq);
 if(B.sel&&B.targets.includes(sq)){
  const from=B.sel; B.sel=null; B.targets=[];
  const mv=B.game.moves({square:from,verbose:true}).filter(m=>m.to===sq);
  if(mv.some(m=>m.promotion)){render();askPromo(B.game.turn(),pr=>{submit({from,to:sq,promotion:pr})});return;}
  submit({from,to:sq}); return;
 }
 if(p&&p.color===B.game.turn()){B.sel=sq;B.targets=B.game.moves({square:sq,verbose:true}).map(m=>m.to);}
 else{B.sel=null;B.targets=[];}
 render();
}
function submit(m){
 const test=new Chess(B.game.fen()); const r=test.move(m); if(!r)return render();
 B.onMove(r); render();
}
function play(san){const r=B.game.move(san); if(r)B.last={from:r.from,to:r.to}; render(); return r;}
function askPromo(color,cb){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box"><div class="label">Promotion : choisis la pièce</div><div class="opts">${['q','r','b','n'].map(t=>`<button data-t="${t}" aria-label="${{q:'Dame',r:'Tour',b:'Fou',n:'Cavalier'}[t]}"><span class="pc ${color}">${G.P[t]}︎</span></button>`).join('')}</div><button data-t="x">Annuler</button></div>`;
 m.onclick=e=>{const b=e.target.closest('button');if(!b)return;m.remove();if(b.dataset.t!=='x')cb(b.dataset.t);};
 $('#board').appendChild(m);
}
function shake(){const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
function reset(fen,orient){B.game=new Chess(fen||undefined);B.orient=orient||'w';B.sel=null;B.targets=[];B.last=null;B.onMove=null;B.locked=false;render();}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let token=0; // annule les animations d'une vue précédente

// ===== Onglet Ouvertures =====
function viewLearnList(){
 token++; reset(); $('#status').textContent='';
 $('#view').innerHTML=`<div class="panel"><div class="label">Avec les blancs</div><div class="list">${opBtns('w')}</div>
 <div class="label">Avec les noirs</div><div class="list">${opBtns('b')}</div></div>`;
 document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>pickVariant(OPENINGS.find(o=>o.id===b.dataset.op)));
}
function opBtns(side){return OPENINGS.filter(o=>o.side===side).map(o=>`<button class="op" data-op="${o.id}"><b>${o.name}</b><small>${o.variants.length} variantes</small></button>`).join('');}
function pickVariant(o){
 token++; reset(null,o.side);
 $('#view').innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><b>${o.name}</b><span class="tag ${o.side}">${o.side==='w'?'Blancs':'Noirs'}</span></div>
 <div class="list" style="grid-template-columns:1fr 1fr">${o.variants.map((v,i)=>`<button class="op" data-v="${i}"><b>${v.name}</b><small>${Math.ceil(v.moves.length/2)} coups</small></button>`).join('')}
 <button class="op primary" data-v="r"><b>Au hasard</b><small>pour réviser</small></button><button class="op" id="back"><b>← Retour</b><small>ouvertures</small></button></div></div>`;
 $('#back').onclick=viewLearnList;
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const i=b.dataset.v==='r'?Math.floor(Math.random()*o.variants.length):+b.dataset.v;learn(o,i);});
}
async function learn(o,vi){ const V=o.variants[vi];
 const my=++token; reset(null,o.side); let i=0, fails=0;
 $('#view').innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><b>${o.name} · ${V.name}</b><span class="tag ${o.side}">${o.side==='w'?'Blancs':'Noirs'}</span></div>
 <div class="progress"><i id="pg" style="width:0"></i></div>
 <div class="msg" id="msg">${o.intro}</div>
 <div class="row"><button id="hint">Indice</button><button id="show">Solution</button><button id="restart">↺</button><button id="back">Liste</button></div></div>`;
 const msg=$('#msg');
 $('#back').onclick=()=>pickVariant(o); $('#restart').onclick=()=>learn(o,vi);
 const pg=()=>$('#pg').style.width=(100*i/V.moves.length)+'%';
 const num=k=>Math.floor(k/2)+1+(k%2?'…':'.');
 async function step(){
  if(my!==token)return; pg();
  if(i>=V.moves.length){msg.innerHTML=`<span class="ok">Ligne terminée !</span> Tu connais cette variante. Refais-la sans indice, puis va dans Exercices pour la tester.`;B.onMove=null;$('#hint').disabled=$('#show').disabled=true;return;}
  const [san,ex]=V.moves[i]; const mine=(i%2===0)===(o.side==='w');
  if(!mine){B.onMove=null; await wait(i===0?900:700); if(my!==token)return; play(san);
   msg.innerHTML=`Adversaire : <b class="move">${num(i)} ${fr(san)}</b><br>${ex}<br><span class="sub">À toi de jouer.</span>`; i++; fails=0; return step();}
  B.onMove=r=>{
   if(r.san===san){play(san);msg.innerHTML=`<span class="ok">Bien joué :</span> <b class="move">${num(i)} ${fr(san)}</b><br>${ex}`;i++;fails=0;step();}
   else{fails++;shake();msg.innerHTML=`<span class="ko">${fr(r.san)} n'est pas le coup de la ligne.</span> ${fails>=2?hintTxt():'Réessaie.'}`;}
  };
 }
 function hintTxt(){const m=new Chess(B.game.fen()).move(V.moves[i][0]);return `Indice : bouge la pièce en <b>${m.from}</b>.`;}
 $('#hint').onclick=()=>{if(i<V.moves.length){const m=new Chess(B.game.fen()).move(V.moves[i][0]);B.sel=m.from;B.targets=B.game.moves({square:m.from,verbose:true}).map(x=>x.to);render();}};
 $('#show').onclick=()=>{if(i<V.moves.length&&B.onMove){const [san,ex]=V.moves[i];play(san);msg.innerHTML=`Le coup était <b class="move">${num(i)} ${fr(san)}</b><br>${ex}`;i++;fails=0;step();}};
 step();
}

// ===== Exercices =====
const EX={mode:'tac',op:'all',ok:0,tot:0};
const TRAPP=TRAPS.map(t=>{const g=new Chess();t.line.split(' ').forEach(m=>g.move(m));return {...t,fen:g.fen(),last:g.history({verbose:true}).pop()};});
function viewEx(){
 token++;
 $('#view').innerHTML=`<div class="panel"><div class="seg"><button data-m="tac">Tactique</button><button data-m="trap">Pièges</button><button data-m="op">Quiz</button></div>
 <select id="opf" style="font:inherit;background:var(--panel2);color:var(--fg);border:0;border-radius:8px;padding:8px" ${EX.mode==='tac'?'hidden':''}><option value="all">Toutes les ouvertures</option>${OPENINGS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select>
 <div class="msg" id="msg"></div><div class="row"><button id="sol">Solution</button><button class="primary" id="next">Suivant</button><span class="score" id="sc" style="margin-left:auto;align-self:center;font-size:.85rem"></span></div></div>`;
 document.querySelectorAll('[data-m]').forEach(b=>{b.classList.toggle('on',b.dataset.m===EX.mode);b.onclick=()=>{EX.mode=b.dataset.m;viewEx();};});
 $('#opf').value=EX.op; $('#opf').onchange=e=>{EX.op=e.target.value;nextEx();};
 $('#next').onclick=nextEx; nextEx();
}
function score(){$('#sc').textContent=`${EX.ok}/${EX.tot}`;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function puzzle(p,msg){
  reset(p.fen,p.fen.split(' ')[1]); if(p.last){B.last=p.last;render();}
  const side=B.game.turn()==='w'?'blancs':'noirs';
  msg.innerHTML=`<b>${p.title}</b><br>Les ${side} jouent. ${p.mate?'Trouve le mat en 1.':'Trouve le meilleur coup.'}`;
  let done=false;
  const finish=good=>{done=true;B.onMove=null;EX.tot++;if(good)EX.ok++;score();};
  B.onMove=r=>{ if(done)return;
   const t=new Chess(B.game.fen());t.move(r.san);
   if(r.san===p.sol||(p.alt||[]).includes(r.san)||(p.mate&&t.in_checkmate())){play(r.san);finish(true);msg.innerHTML=`<span class="ok">Exact : ${fr(r.san)}</span><br>${p.expl}`;}
   else{shake();msg.innerHTML=`<span class="ko">${fr(r.san)} : non.</span> Cherche encore, ou appuie sur Solution.`;}};
  $('#sol').onclick=()=>{if(done)return;play(p.sol);finish(false);msg.innerHTML=`Solution : <b class="move">${fr(p.sol)}</b><br>${p.expl}`;};
}
function nextEx(){
 const my=++token; score(); const msg=$('#msg');
 const ops=EX.op==='all'?OPENINGS:OPENINGS.filter(o=>o.id===EX.op);
 if(EX.mode==='tac') return puzzle(pick(PUZZLES),msg);
 if(EX.mode==='trap'){const pool=TRAPP.filter(t=>ops.some(o=>o.id===t.op));
   if(!pool.length){reset();msg.textContent="Pas encore de piège pour cette ouverture : choisis « Toutes ».";return;}
   return puzzle(pick(pool),msg);}
 const o=pick(ops), V=pick(o.variants);
 const mineIdx=V.moves.map((_,k)=>k).filter(k=>(k%2===0)===(o.side==='w')&&k>=2);
 const k=pick(mineIdx);
 reset(null,o.side); for(let j=0;j<k;j++)B.game.move(V.moves[j][0]);
 B.last=B.game.history({verbose:true}).pop(); render();
 const hist=V.moves.slice(0,k).map(m=>m[0]).join(' ');
 // tous les coups de cette ouverture valables depuis cette position
 const ok=new Set(o.variants.filter(w=>w.moves.length>k&&w.moves.slice(0,k).map(m=>m[0]).join(' ')===hist).map(w=>w.moves[k][0]));
 const recent=V.moves.slice(Math.max(0,k-4),k).map((m,j)=>{const n=Math.max(0,k-4)+j;return (n%2?'':(n/2+1)+'.')+fr(m[0]);}).join(' ');
 msg.innerHTML=`<b>${o.name} · ${V.name}</b><br>Après ${k>4?"…":""}${recent}. Quel est le coup de la ligne ?`;
 let done=false, tries=0;
 const finish=good=>{done=true;B.onMove=null;EX.tot++;if(good)EX.ok++;score();};
 B.onMove=r=>{if(done)return;
  if(ok.has(r.san)){play(r.san);finish(tries===0);const w=o.variants.find(w=>w.moves.slice(0,k).map(m=>m[0]).join(' ')===hist&&w.moves[k][0]===r.san);msg.innerHTML=`<span class="ok">Oui : ${fr(r.san)}</span><br>${w.moves[k][1]}`;}
  else{tries++;shake();msg.innerHTML=`<span class="ko">${fr(r.san)} n'est pas dans la ligne.</span> ${tries>=2?'Indice : bouge la pièce en <b>'+new Chess(B.game.fen()).move(V.moves[k][0]).from+'</b>.':'Réessaie.'}`;}};
 $('#sol').onclick=()=>{if(done)return;play(V.moves[k][0]);finish(false);msg.innerHTML=`Le coup : <b class="move">${fr(V.moves[k][0])}</b><br>${V.moves[k][1]}`;};
}

// ===== Jouer =====
const PL={elo:1200,color:'w'};
function viewPlay(){
 token++; reset(null,PL.color);
 $('#view').innerHTML=`<div class="panel">
 <div class="levels">${[800,1000,1200,1400,1600,1800,2000].map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>
 
 <div class="msg" id="msg"></div><div class="hist" id="hist"></div>
 <div class="row tight" style="flex-wrap:nowrap"><div class="seg" style="flex:2"><button data-c="w">Blancs</button><button data-c="b">Noirs</button></div><button class="primary" id="new">Nouvelle</button><button id="undo">Annuler</button><button id="flip">⇅</button></div></div>`;
 const sync=()=>{document.querySelectorAll('[data-e]').forEach(b=>b.classList.toggle('on',+b.dataset.e===PL.elo));document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===PL.color));};
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{PL.elo=+b.dataset.e;sync();});
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{PL.color=b.dataset.c;sync();newGame();});
 $('#new').onclick=newGame; $('#flip').onclick=()=>{B.orient=B.orient==='w'?'b':'w';render();};
 $('#undo').onclick=()=>{if(B.locked)return;B.game.undo();if(B.game.turn()!==PL.color)B.game.undo();const h=B.game.history({verbose:true});B.last=h.length?h[h.length-1]:null;B.sel=null;B.targets=[];render();upd();};
 sync(); newGame();
}
function upd(){
 const g=B.game,msg=$('#msg'); if(!msg)return;
 const h=g.history(); $('#hist').textContent=h.map((m,i)=>(i%2?'':(i/2+1)+'. ')+fr(m)).join(' ');
 if(g.in_checkmate())msg.innerHTML=g.turn()===PL.color?'<span class="ko">Échec et mat. L\'ordinateur gagne.</span>':'<span class="ok">Échec et mat ! Tu as gagné.</span>';
 else if(g.in_stalemate())msg.textContent='Pat : partie nulle.';
 else if(g.in_threefold_repetition())msg.textContent='Nulle par répétition.';
 else if(g.insufficient_material())msg.textContent='Nulle : matériel insuffisant.';
 else if(g.in_draw())msg.textContent='Partie nulle (règle des 50 coups).';
 else msg.innerHTML=(g.turn()===PL.color?'À toi de jouer.':'L\'ordinateur réfléchit…')+(g.in_check()?' <span class="ko">Échec !</span>':'');
}
function newGame(){
 const my=++token; reset(null,PL.color); upd();
 B.onMove=r=>{play(r.san);upd();computer(my);};
 if(PL.color==='b')computer(my);
}
async function computer(my){
 if(B.game.game_over()||B.game.turn()===PL.color)return;
 B.locked=true; upd(); await wait(60); if(my!==token)return;
 const t=Date.now(); const san=bestMove(new Chess(B.game.fen()+''),PL.elo,true,B.game.history());
 await wait(Math.max(0,500-(Date.now()-t))); if(my!==token)return;
 play(san); B.locked=false; upd();
}
// livre : bestMove lit l'historique, on lui passe une partie rejouée
const _bm=bestMove; bestMove=function(g,elo,book,hist){const x=new Chess();for(const m of hist)x.move(m);return _bm(x,elo,book);};

// ===== Onglets =====
const tabs={learn:viewLearnList,ex:viewEx,play:viewPlay};
for(const k in tabs)$('#t-'+k).onclick=()=>{document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));$('#t-'+k).classList.add('on');tabs[k]();};
viewLearnList();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
